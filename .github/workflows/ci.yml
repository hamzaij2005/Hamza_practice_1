name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t myapp:${{ github.sha }} .

      - name: Run container
        run: docker run -d -p 5000:5000 --name test_container myapp:${{ github.sha }}

      - name: Test API
        run: curl http://localhost:5000/api/health

      - name: Stop container
        run: docker stop test_container

  report:
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        run: echo "Pipeline complete for commit: ${{ github.sha }}"

      - name: Use Secret
        run: echo "Secret loaded successfully"
        env:
          LAB_SECRET: ${{ secrets.LAB_SECRET }}